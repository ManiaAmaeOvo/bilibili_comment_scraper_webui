<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站评论爬取工具 ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Make sure the path to your CSS file is correct -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>B站评论爬取工具</h1>
            <p class="subtitle">简单、高效地获取B站视频评论</p>
        </header>

        <div class="form-container">
            <div class="step">
                <div class="step-header">
                    <span class="step-number">1</span>
                    <h2>获取 Cookie</h2>
                </div>
                <p>点击下方按钮自动获取当前浏览器的B站Cookie，或手动粘贴。</p>
                <button id="get-cookie-btn" class="secondary-btn">自动获取Cookie</button>
                <textarea id="cookie-input" rows="4" placeholder="自动获取后会填充于此，或在此处手动粘贴..."></textarea>
            </div>
            
            <div class="step">
                <div class="step-header">
                    <span class="step-number">2</span>
                    <h2>配置爬取任务</h2>
                </div>
                <p>输入目标视频的BV号，并选择是否爬取二级评论。</p>
                <input type="text" id="bvid-input" placeholder="例如: BV1TAnozgEpe">
                
                <div class="options-container">
                    <input type="checkbox" id="sub-comments-checkbox" checked>
                    <label for="sub-comments-checkbox">爬取楼中楼 (二级评论)</label>
                </div>
            </div>
            <div class="button-group">
                <button id="start-btn">
                    <span class="btn-text">开始爬取</span>
                    <div class="spinner"></div>
                </button>

                <button id="stop-btn" class="hidden">停止并保存</button>
            </div>
        </div>
        
        <div class="console-container">
            <h2><span class="console-icon"></span>实时日志</h2>
            <div id="log-console">
                <p class="log-info">等待操作...</p>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"> </script>
</body>
</html>
